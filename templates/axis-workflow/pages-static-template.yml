# TEMPLATE ONLY: copy to .github/workflows/ in a deliberate change review.
# Does not activate while stored under templates/.
# Site preview/deployment: update path and protect the github-pages environment first.
name: NEXUS Static GitHub Pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-static-pages-manual
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate static output exists
        run: test -f dashboard/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
