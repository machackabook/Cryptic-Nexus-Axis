name: AXIS Queue Health
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: axis-queue-health
  cancel-in-progress: true
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only queue and integration summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "AXIS queue health (read only)"
          gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title,labels             --jq '.[] | "#\(.number) \(.title)"' | head -n 100
          echo "No mutation, agent execution or deployment performed."
